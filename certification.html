<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- R1 : aucune ressource externe. Le CSP interdit tout chargement réseau (pas de CDN, pas de police, pas d'image distante). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Parcours de certification</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#1b1f24;--muted:#58606b;--border:#cfd4db;--primary:#1f5fbf;--primary-text:#fff;--danger:#b3261e;--ok:#1a7f37;--warn:#8a5a00;--focus:#ff9f1a;--radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--surface:#1e2228;--text:#eceff3;--muted:#a6adb8;--border:#3a414b;--primary:#6ea4f5;--primary-text:#0c1a2e;--danger:#ff8a80;--ok:#5fd07c;--warn:#f0b64d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:8px;z-index:100}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:8px;align-items:center;font-weight:600}
.brand small{color:var(--muted);font-weight:400}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:.85rem;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
nav .btn[aria-current=page],.btn.on{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .6em}
h2{font-size:1.15rem;margin:1em 0 .5em}
.btn{display:inline-flex;gap:6px;align-items:center;min-height:36px;padding:4px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:30px;padding:2px 8px;font-size:.9rem}
.btn:disabled{opacity:.6;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.banner{margin:12px 16px 0;padding:10px 14px;border:1px solid var(--border);border-left-width:6px;border-radius:var(--radius);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.banner.error{border-left-color:var(--danger)}.banner.warn{border-left-color:var(--warn)}.banner.ok{border-left-color:var(--ok)}
.banner .grow{flex:1 1 300px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.kpi{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.kpi b{display:block;font-size:1.6rem;line-height:1.2}.kpi span{color:var(--muted);font-size:.85rem}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}
table{border-collapse:collapse;width:100%}
caption{text-align:left;padding:8px 12px;color:var(--muted)}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--border);vertical-align:top}
th{font-size:.85rem;color:var(--muted)}
td.act{white-space:nowrap}td.num,th.num{text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--border);font-size:.8rem;white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.ko{border-color:var(--danger);color:var(--danger)}.pill.wa{border-color:var(--warn);color:var(--warn)}.pill.in{border-color:var(--primary);color:var(--primary)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:20px;max-width:min(560px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 24px);overflow:auto}
dialog.wide{max-width:min(920px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 8px;font-size:1.2rem}
.fld{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.fld input[type=text],.fld input[type=password],.fld input[type=date],.fld input[type=number],.fld input[type=month],.fld input[type=search],.fld input[type=file],.fld select,.fld textarea,.inl input,.inl select{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);max-width:100%}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.cols{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chkgrp{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg)}
.chkgrp label{display:flex;gap:6px;align-items:center}
.inl{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.inl label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem}
.err{color:var(--danger);min-height:1.2em;margin:8px 0}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 24px));z-index:200}
.toast{padding:10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--ok);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.toast.error{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.profbtn{display:flex;flex-direction:column;gap:8px}
.profbtn .btn{justify-content:flex-start;padding:10px 14px}
.profbtn .btn[aria-pressed=true]{border-color:var(--primary);border-width:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin:6px 0;background:var(--surface);cursor:pointer}
.opt:has(input:checked){border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt.good{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.opt.bad{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.q{font-size:1.1rem;margin:0 0 8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem}
progress{width:100%;height:10px}
.qnav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.qnav .btn{min-width:36px;justify-content:center}.qnav .btn.done{background:var(--primary);color:var(--primary-text)}.qnav .btn[aria-current=true]{outline:3px solid var(--focus)}
.ordrow{display:flex;gap:6px;align-items:center;margin:4px 0;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.ordrow span{flex:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;align-items:center}
.tree ul{list-style:none;margin:0;padding-left:20px}.tree li{margin:4px 0}.tree .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warn-txt{color:var(--warn)}.err-txt{color:var(--danger)}.ok-txt{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){main{padding:10px}.match{grid-template-columns:1fr}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Application de gestion de parcours de certification
   Un seul fichier, JavaScript vanilla. Aucune donnée métier ici (R2) :
   tout est lu/écrit dans des fichiers JSON du dossier OneDrive (R3).
   ===================================================================== */

/* ====== Configuration ====== */
const APP = {id:'CERTIFICATION_APP', name:'Parcours de certification', version:'1.0.0', schema:'1.0.0'};
const CFG = {idleMs:15*60e3, absMs:8*3600e3, reauthMs:5*60e3, iter:600000, minPwd:12, maxPwd:128, keepBackups:10};
const PROFILES = {USER:'Utilisateur', MANAGER:'Gestionnaire', ADMIN:'Administrateur'};   // R4
const NS = 'http://www.w3.org/2000/svg';

/* Droits (moindre privilège : tout ce qui n'est pas listé est refusé). Contrôlés dans les services (need()), pas seulement par l'affichage. */
const P_USER = ['self.take','self.results'];
const P_ADMIN = ['self.take','self.results','results.all','dash.all','training.view','training.manage','training.import','catalog.manage','org.manage','accounts.manage','settings.manage','folder.manage','backup.manage','audit.read'];
const P_MANAGER_DEFAULT = ['self.take','self.results','results.scope','dash.scope','training.view','training.manage','training.import','audit.scope'];
const P_MANAGER_OPTIONAL = [['training.manage','Modifier les statuts de formation'],['training.import','Importer les inscriptions de formation'],['audit.scope','Consulter le journal dans son périmètre'],['catalog.manage','Créer/modifier parcours, modules et questions (« à arbitrer »)']];

/* Libellés */
const SESS_STATE = {NOT_STARTED:'Non commencé',IN_PROGRESS:'En cours',AWAITING_REMEDIATION:'En attente de remédiation',VALIDATED:'Validé',FAILED:'Non validé',ABANDONED:'Abandonné',EXPIRED:'Expiré'};
const MOD_STATE = {NOT_STARTED:'Non commencé',IN_PROGRESS:'En cours',VALIDATED:'Validé',NON_VALIDATED:'Non validé',TO_RETAKE:'À rattraper',SUSPENDED:'Suspendu'};
const CERT_STATUS = {DRAFT:'Brouillon',VALIDATION:'En validation',PUBLISHED:'Publié',SUSPENDED:'Suspendu',ARCHIVED:'Archivé'};
const QTYPES = {QCU:'QCU (choix unique)',QCM:'QCM (choix multiple)',TF:'Vrai / Faux',ORDER:'Classement',MATCH:'Mise en correspondance'};
const TRAIN = {TO_REGISTER:'À inscrire',REGISTERED:'Inscrit',PLANNED:'Planifiée',IN_PROGRESS:'En cours',DONE:'Réalisée',ABSENT:'Absent',CANCELLED:'Annulée',TO_RESCHEDULE:'À reprogrammer'};
const DIFFS = {1:'Facile',2:'Moyen',3:'Difficile'};
const ORG_TYPES = {ENTERPRISE:'Entreprise',REGION:'Région',SECTOR:'Secteur',AGENCY:'Agence'};
const ORG_CHILD = {ENTERPRISE:'REGION',REGION:'SECTOR',SECTOR:'AGENCY'};
const ORG_PARENT = {REGION:'ENTERPRISE',SECTOR:'REGION',AGENCY:'SECTOR'};

/* ====== Fichiers de données (un fichier JSON par domaine, enveloppe { version, updatedAt, data:[...] }) ====== */
const REF = {manifest:'manifest.json',users:'configuration/users.json',accounts:'configuration/local_accounts.json',org:'configuration/organization.json',
  settings:'configuration/settings.json',perms:'configuration/permissions.json',certs:'catalog/certifications.json',modules:'catalog/modules.json',
  questions:'catalog/questions.json',banks:'catalog/question_banks.json'};
/* Données transactionnelles : un fichier par objet, à nom unique (limite les conflits OneDrive) */
const TXD = {sessions:'transactions/sessions',attempts:'transactions/attempts',needs:'transactions/training_needs',regs:'transactions/training_registrations',
  audit:'transactions/audit_events',certificates:'certificates',versions:'catalog/certification_versions'};

/* ====== État (en mémoire uniquement) ====== */
const S = {handle:null, env:null, access:'NONE', error:null, profile:'USER', account:null, authAt:0, startAt:0, activity:Date.now(),
  sessionId:crypto.randomUUID(), view:'home', param:null, collab:null, run:null, failCount:0, blockedUntil:0, accessOpen:false, flt:{}};
const D = {ref:{}, tx:{sessions:new Map(),attempts:new Map(),needs:new Map(),regs:new Map(),certificates:new Map(),versions:new Map()}, anomalies:[], audit:null};
const R = n => D.ref[n].doc.data;
const ST = () => R('settings')[0];

/* ====== Utilitaires ====== */
class AppError extends Error{constructor(code,title,msg,action){super(msg);this.code=code;this.title=title;this.action=action||'';}}
function toAppError(e){
  if(e instanceof AppError)return e;
  if(e&&e.name==='NotAllowedError')return new AppError('FS-PERMISSION_DENIED','Accès refusé','Le navigateur a refusé l’accès au dossier.','Autoriser l’accès depuis la fenêtre de validation.');
  if(e&&e.name==='NotFoundError')return new AppError('FS-NOT_FOUND','Dossier ou fichier introuvable','Un élément attendu est absent (dossier déplacé ?).','Sélectionner à nouveau le dossier (administrateur).');
  if(e&&e.name==='NotReadableError')return new AppError('FS-UNAVAILABLE','Fichier indisponible localement','Le fichier n’est peut-être pas téléchargé par OneDrive (« en ligne uniquement »).','Rendre le dossier disponible sur l’appareil (« Toujours conserver sur cet appareil »).');
  if(e instanceof SyntaxError)return new AppError('DB-JSON_INVALID','Fichier de données illisible','Un fichier JSON est invalide.','Restaurer une sauvegarde ou contacter l’administrateur.');
  return new AppError('FS-UNKNOWN','Erreur technique',(e&&e.message)||String(e),'Réessayer ; si le problème persiste, contacter l’administrateur.');
}
const now=()=>new Date().toISOString().replace(/\.\d{3}Z$/,'Z');
const today=()=>new Date().toLocaleDateString('sv-SE');
const uid=()=>crypto.randomUUID();
const fmtDate=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
const fmtTs=t=>{try{return t?new Date(t).toLocaleString('fr-FR'):'—';}catch(e){return t;}};

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function icon(n){const s=document.createElementNS(NS,'svg');s.setAttribute('class','ic');s.setAttribute('aria-hidden','true');s.setAttribute('focusable','false');const u=document.createElementNS(NS,'use');u.setAttribute('href','#i-'+n);s.append(u);return s;}
function btn(label,ic,onclick,cls,extra){return h('button',{type:'button',class:'btn '+(cls||''),onclick,...(extra||{})},ic?icon(ic):null,label?h('span',null,label):null);}

const csvCell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};   // anti injection de formule
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
const downloadCsv=(name,rows)=>download(name,toCsv(rows),'text/csv;charset=utf-8');
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';const del=first.split(';').length>=first.split(',').length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

/* ====== Crypto (Web Crypto, aucun mot de passe en clair) ====== */
const enc=new TextEncoder();
const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pwd,salt,iter){
  const k=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256));
}
async function makeCred(pwd){const salt=crypto.getRandomValues(new Uint8Array(16));return {salt:b64e(salt),hash:b64e(await derive(pwd,salt,CFG.iter)),iterations:CFG.iter,algo:'PBKDF2-SHA256'};}
function eq(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a[i]^b[i];return r===0;}
async function sha256(data){const b=typeof data==='string'?enc.encode(data):data;return [...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');}
const DUMMY_SALT=new Uint8Array(16);
async function verifyLogin(accounts,login,pwd,profile){
  const l=String(login).trim().toLowerCase();
  const acc=accounts.find(a=>a.login.toLowerCase()===l);
  const hh=await derive(pwd,acc?b64d(acc.salt):DUMMY_SALT,acc?acc.iterations:CFG.iter);   // même coût si le compte n'existe pas (message neutre)
  return (acc&&acc.active&&acc.profiles.includes(profile)&&eq(hh,b64d(acc.hash)))?acc:null;
}
function pwdError(p,p2){
  if(p.length<CFG.minPwd)return `Le mot de passe doit contenir au moins ${CFG.minPwd} caractères.`;
  if(p.length>CFG.maxPwd)return `Le mot de passe ne doit pas dépasser ${CFG.maxPwd} caractères.`;
  if(p2!==undefined&&p!==p2)return 'Les deux mots de passe sont différents.';
  return null;
}

/* ====== IndexedDB : handle du dossier (R8) — un seul object store « settings », clé « dataDirHandle » ====== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('certification_app',1);r.onupgradeneeded=()=>r.result.createObjectStore('settings');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('settings').objectStore('settings').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('settings','readwrite');t.objectStore('settings').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('settings','readwrite');t.objectStore('settings').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

/* ====== Accès fichiers (File System Access API) ====== */
async function fsGuard(root){   // vérifie la permission avant chaque écriture (AT-006)
  root=root||S.handle;
  if(!root)throw new AppError('FS-NO_HANDLE','Dossier non configuré','Aucun dossier de données.','Contacter l’administrateur.');
  if(root.queryPermission&&await root.queryPermission({mode:'readwrite'})!=='granted')throw new AppError('FS-PERMISSION_DENIED','Accès refusé','L’autorisation d’écriture n’est plus active.','Autoriser l’accès depuis la fenêtre de validation.');
}
const splitPath=p=>{const a=p.split('/');return [a.slice(0,-1),a[a.length-1]];};
async function dirAt(root,parts,create){let d=root;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d;}
async function readFile(path,root){
  root=root||S.handle;const [dp,name]=splitPath(path);
  try{const d=await dirAt(root,dp,false);return await (await d.getFileHandle(name)).getFile();}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e;}
}
async function readText(path,root){const f=await readFile(path,root);return f?{text:await f.text(),mtime:f.lastModified}:null;}
async function readJson(path,root){
  const r=await readText(path,root);if(!r)return null;
  try{return JSON.parse(r.text);}catch(e){throw new AppError('DB-JSON_INVALID','Fichier JSON invalide',`${path} n’est pas un JSON valide.`,'Restaurer une sauvegarde (le fichier n’est pas écrasé).');}
}
/* Écriture en une seule opération : createWritable → write → close */
async function writeData(path,data,root){
  root=root||S.handle;await fsGuard(root);
  const [dp,name]=splitPath(path);const d=await dirAt(root,dp,true);const fh=await d.getFileHandle(name,{create:true});
  const w=await fh.createWritable();
  try{await w.write(data);await w.close();}catch(e){try{await w.abort();}catch(_){}throw e;}
}
const writeJson=(path,obj,root)=>writeData(path,JSON.stringify(obj,null,2),root);
const envelope=data=>({version:1,updatedAt:now(),data});
async function listDir(path,root){
  root=root||S.handle;
  try{const d=await dirAt(root,path?path.split('/'):[],false);const out=[];for await(const [n,hd] of d.entries())out.push([n,hd]);return out;}
  catch(e){if(e.name==='NotFoundError')return [];throw e;}
}
async function walkTree(path,skipTop){   // liste récursive des fichiers (chemins relatifs à `path`)
  const out=[];
  const rec=async(dir,prefix,top)=>{for await(const [n,hd] of dir.entries()){
    if(top&&skipTop&&skipTop.includes(n))continue;
    if(hd.kind==='directory')await rec(hd,prefix+n+'/',false);else out.push(prefix+n);}};
  const dir=await dirAt(S.handle,path?path.split('/'):[],false);await rec(dir,'',true);return out;
}

/* ====== Schémas et validation (RNF-005) ====== */
const str=v=>typeof v==='string'&&v.length>0;
const SCH={
  manifest:r=>str(r.dataSetId)&&str(r.schemaVersion)&&r.applicationId===APP.id,
  users:r=>str(r.id)&&str(r.lastName)&&typeof r.firstName==='string'&&typeof r.active==='boolean'&&Array.isArray(r.orgHistory),
  accounts:r=>str(r.id)&&str(r.login)&&Array.isArray(r.profiles)&&str(r.salt)&&str(r.hash)&&Number.isInteger(r.iterations)&&typeof r.active==='boolean',
  org:r=>str(r.id)&&!!ORG_TYPES[r.type]&&str(r.code)&&str(r.name),
  settings:r=>Number.isInteger(r.decimals)&&r.certificate&&typeof r.certificate==='object',
  perms:r=>r.profile==='MANAGER'&&Array.isArray(r.permissions),
  certs:r=>str(r.id)&&str(r.code)&&str(r.title)&&!!CERT_STATUS[r.status]&&r.draft&&Array.isArray(r.draft.modules),
  modules:r=>str(r.id)&&str(r.code)&&str(r.title)&&Array.isArray(r.bankIds),
  questions:r=>str(r.id)&&!!QTYPES[r.type]&&str(r.text)&&Number(r.points)>0,
  banks:r=>str(r.id)&&str(r.name)
};
const TXS={sessions:r=>str(r.id)&&str(r.userId)&&str(r.certificationVersionId),attempts:r=>str(r.id)&&str(r.sessionId)&&Array.isArray(r.questions),
  needs:r=>str(r.id)&&str(r.userId),regs:r=>str(r.id)&&str(r.needId),certificates:r=>str(r.id)&&str(r.number),versions:r=>str(r.id)&&Array.isArray(r.modules),audit:r=>str(r.id)&&str(r.action)};
function validateDoc(name,doc,table){
  if(!(doc&&doc.version===1&&typeof doc.updatedAt==='string'&&Array.isArray(doc.data)))throw new AppError('INTEGRITY-SCHEMA','Fichier invalide',`${REF[name]||name} : enveloppe { version, updatedAt, data } absente.`,'Restaurer une sauvegarde.');
  const bad=doc.data.findIndex(r=>!(r&&table[name](r)));
  if(bad>=0)throw new AppError('INTEGRITY-SCHEMA','Fichier invalide',`${REF[name]||name} : enregistrement n°${bad+1} non conforme au schéma.`,'Restaurer une sauvegarde.');
}

/* ====== Chargement et écriture des données ====== */
const major=v=>String(v).split('.')[0];
async function loadAll(root,expectedId){
  root=root||S.handle;
  const m=await readJson(REF.manifest,root);
  if(!m)throw new AppError('DB-MANIFEST_MISSING','Base introuvable','Le fichier manifest.json est absent du dossier sélectionné.','Sélectionner le bon dossier (administrateur).');
  validateDoc('manifest',m,SCH);const mf=m.data[0];
  if(major(mf.schemaVersion)!==major(APP.schema))throw new AppError('DB-SCHEMA_VERSION','Version de base incompatible',`Base en version ${mf.schemaVersion}, application en version ${APP.schema}.`,'Utiliser la version d’application correspondante (aucune écriture effectuée).');
  if(mf.status&&mf.status!=='ACTIVE')throw new AppError('DB-INACTIVE','Base inactive','La base n’est pas à l’état ACTIVE.','Contacter l’administrateur.');
  if(expectedId&&mf.dataSetId!==expectedId)throw new AppError('DB-WRONG_DATASET','Jeu de données différent','Le dossier ne contient plus le jeu de données mémorisé sur ce poste.','Un administrateur doit sélectionner à nouveau le dossier.');
  const ref={manifest:{doc:m,mtime:0}};
  for(const n of Object.keys(REF)){
    if(n==='manifest')continue;
    const r=await readText(REF[n],root);
    if(!r){
      if(n==='perms'){ref[n]={doc:envelope([{profile:'MANAGER',permissions:P_MANAGER_DEFAULT}]),mtime:0,virtual:true};continue;}   // fichier facultatif (ERR-004)
      throw new AppError('DB-FILE_MISSING','Fichier obligatoire manquant',`${REF[n]} est absent.`,'Vérifier la synchronisation OneDrive ou restaurer une sauvegarde.');
    }
    let doc;try{doc=JSON.parse(r.text);}catch(e){throw new AppError('DB-JSON_INVALID','Fichier JSON invalide',`${REF[n]} n’est pas un JSON valide.`,'Restaurer une sauvegarde (le fichier n’est pas écrasé).');}
    validateDoc(n,doc,SCH);ref[n]={doc,mtime:r.mtime};
  }
  const tx={},anomalies=[];
  for(const k of ['sessions','attempts','needs','regs','certificates','versions'])tx[k]=await loadDir(k,root,anomalies);
  D.ref=ref;D.tx=tx;D.anomalies=anomalies;D.audit=null;
}
async function loadDir(kind,root,anomalies){
  const map=new Map();const ents=(await listDir(TXD[kind],root)).filter(([n,hd])=>hd.kind==='file'&&n.endsWith('.json'));
  for(let i=0;i<ents.length;i+=25){
    await Promise.all(ents.slice(i,i+25).map(async([n,hd])=>{
      const path=`${TXD[kind]}/${n}`;
      try{
        const doc=JSON.parse(await (await hd.getFile()).text());
        const rec=doc&&Array.isArray(doc.data)&&doc.data[0];
        if(!rec||!TXS[kind](rec)){anomalies.push({path,code:'SCHEMA',msg:'Structure non conforme (fichier ignoré, non écrasé).'});return;}
        if(map.has(rec.id)){anomalies.push({path,code:'DUPLICATE',msg:`Identifiant déjà présent (copie de synchronisation ?) : ${rec.id}`});return;}
        map.set(rec.id,rec);
      }catch(e){anomalies.push({path,code:e.name==='NotReadableError'?'UNAVAILABLE':'JSON_INVALID',msg:e.name==='NotReadableError'?'Fichier non disponible localement (OneDrive).':'JSON invalide (fichier ignoré, non écrasé).'});}
    }));
  }
  return map;
}
async function reload(){try{await loadAll(S.handle,S.env&&S.env.expectedDataSetId);S.access='READY';S.error=null;render();}catch(e){S.access='ERROR';S.error=toAppError(e);render();}}

/* Écriture d'un fichier de référence : contrôle de conflit (date de modification), copie de sécurité, écriture unique, relecture. */
async function saveRef(name,mutate){
  const path=REF[name],cur=D.ref[name];
  const disk=await readText(path);
  if(disk&&!cur.virtual&&disk.mtime!==cur.mtime)throw new AppError('WRITE-CONFLICT','Conflit de modification','Le fichier a été modifié depuis son chargement (autre poste ou synchronisation OneDrive).');
  const doc=structuredClone(cur.doc);mutate(doc.data);doc.updatedAt=now();
  validateDoc(name,doc,SCH);
  if(disk)await writeData('backups/auto/'+path.replace(/\//g,'__'),disk.text);   // copie de sécurité avant modification (10.5)
  await writeJson(path,doc);
  const back=await readText(path);
  if(!back||JSON.stringify(JSON.parse(back.text))!==JSON.stringify(doc))throw new AppError('WRITE-VERIFY','Écriture non confirmée','La relecture du fichier ne correspond pas à ce qui a été écrit.','Vérifier OneDrive et réessayer.');
  D.ref[name]={doc,mtime:back.mtime};
}
/* Écriture d'un objet transactionnel : un fichier par identifiant. Une tentative terminée est immuable (RF-050). */
async function putTx(kind,obj,opt){
  const old=D.tx[kind].get(obj.id);
  if(kind==='attempts'&&old&&old.status!=='in_progress')throw new AppError('DATA-IMMUTABLE','Tentative terminée','Une tentative terminée n’est plus modifiable.','');
  const doc=envelope([obj]);
  await writeJson(`${TXD[kind]}/${obj.id}.json`,doc);
  if(opt&&opt.verify){const back=await readJson(`${TXD[kind]}/${obj.id}.json`);if(!back||JSON.stringify(back.data[0])!==JSON.stringify(obj))throw new AppError('WRITE-VERIFY','Écriture non confirmée','La relecture ne correspond pas à ce qui a été écrit.','Vérifier OneDrive et réessayer.');}
  D.tx[kind].set(obj.id,obj);
}

/* ====== Journal d'audit (événements immuables, un fichier par événement) ====== */
let auditQ=Promise.resolve();
function audit(action,object,summary,extra){
  if(!S.handle||S.access!=='READY')return;
  const ctx={accountId:S.account?S.account.id:null,login:S.account?S.account.login:null,profile:S.profile,collaboratorId:S.collab};
  auditQ=auditQ.then(async()=>{
    try{
      const ev={id:uid(),timestamp:now(),sessionId:S.sessionId,...ctx,action,object:String(object==null?'':object).slice(0,120),summary:String(summary||'').slice(0,300),appVersion:APP.version,...(extra||{})};
      ev.hash=await sha256(JSON.stringify(ev));
      await writeJson(`${TXD.audit}/${ev.id}.json`,envelope([ev]));
      if(D.audit)D.audit.push(ev);
    }catch(e){console.warn('Audit non écrit',e);}
  });
}
async function loadAudit(){
  const a=[];const ents=(await listDir(TXD.audit)).filter(([n,hd])=>hd.kind==='file'&&n.endsWith('.json'));
  for(let i=0;i<ents.length;i+=40)await Promise.all(ents.slice(i,i+40).map(async([n,hd])=>{try{const d=JSON.parse(await (await hd.getFile()).text());if(d.data&&d.data[0]&&TXS.audit(d.data[0]))a.push(d.data[0]);}catch(e){D.anomalies.push({path:`${TXD.audit}/${n}`,code:'JSON_INVALID',msg:'Événement illisible.'});}}));
  a.sort((x,y)=>y.timestamp.localeCompare(x.timestamp));D.audit=a;return a;
}
async function auditOk(ev){const {hash,...rest}=ev;return hash===await sha256(JSON.stringify(rest));}

    if(extra)form.append(extra);
    form.append(err);
    const ok=h('button',{type:'submit',class:'btn '+(danger?'danger':'primary')},submit||'Valider');
    const cancel=(persist||noCancel)?null:h('button',{type:'button',class:'btn',onclick:()=>dlg.close()},cancelLabel||'Annuler');
    form.append(h('div',{class:'dlgbtns'},cancel,ok));
    form.addEventListener('submit',async ev=>{
      ev.preventDefault();err.textContent='';
      const v={};
      for(const f of fields||[]){
        v[f.name]=get[f.name]();
        const empty=v[f.name]===''||v[f.name]==null||(Array.isArray(v[f.name])&&!v[f.name].length);
        if(f.required&&empty&&f.type!=='checkbox'){err.textContent=`Le champ « ${f.label} » est obligatoire.`;return;}
        if(f.type==='number'&&v[f.name]!=null&&((f.min!=null&&v[f.name]<f.min)||(f.max!=null&&v[f.name]>f.max))){err.textContent=`« ${f.label} » doit être compris entre ${f.min??'−∞'} et ${f.max??'+∞'}.`;return;}
      }
      ok.disabled=true;
      try{const m=onSubmit?await onSubmit(v):null;if(m){err.textContent=m;ok.disabled=false;return;}}
      catch(e){const ae=toAppError(e);
        if(ae.code==='WRITE-CONFLICT'||ae.code==='FS-PERMISSION_DENIED'){dlg.close();fail(ae);return;}   // conflit OneDrive / permission perdue : avertir et proposer de recharger
        err.textContent=`${ae.code} — ${ae.message}`;ok.disabled=false;return;}
      resolve(v);dlg.close();
    });
    dlg.addEventListener('cancel',e=>{if(persist)e.preventDefault();});
    dlg.addEventListener('close',()=>{dlg.remove();resolve(null);});
    dlg.append(form);document.body.append(dlg);dlg.showModal();
    const first=form.querySelector('input,select,textarea,button');if(first)first.focus();
  });
}
const confirmDialog=(title,msg,danger,label)=>formDialog({title,intro:msg,fields:[],submit:label||'Confirmer',danger});
function infoDialog(title,content,wide){return formDialog({title,intro:content,fields:[],submit:'Fermer',noCancel:true,wide});}

/* =====================================================================
   SERVICES MÉTIER (centralisés : notation, validation, rattrapage, périmètres)
   ===================================================================== */
const txAll=k=>[...D.tx[k].values()];
const getUser=id=>R('users').find(u=>u.id===id);
const getCert=id=>R('certs').find(c=>c.id===id);
const getModule=id=>R('modules').find(m=>m.id===id);
const getOrg=id=>R('org').find(o=>o.id===id);
const fullName=u=>u?`${u.firstName} ${u.lastName}`.trim():'—';
const round=(x,d)=>{const f=10**(d==null?ST().decimals:d);return Math.round((x+Number.EPSILON)*f)/f;};   // règle d'arrondi unique (RF-051)
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/2**32*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};

/* ====== Organisation et périmètres ====== */
function orgAncestors(id){const out=[],seen=new Set();let o=getOrg(id);while(o&&!seen.has(o.id)){out.push(o.id);seen.add(o.id);o=o.parentId?getOrg(o.parentId):null;}return out;}
const orgPath=id=>orgAncestors(id).reverse().map(i=>(getOrg(i)||{}).name).join(' › ')||'—';
function orgDescendants(id){const out=new Set([id]);let ch=true;while(ch){ch=false;for(const o of R('org'))if(o.parentId&&out.has(o.parentId)&&!out.has(o.id)){out.add(o.id);ch=true;}}return out;}
function userOrgAt(u,date){let cur=null;for(const x of [...u.orgHistory].sort((a,b)=>a.from.localeCompare(b.from)))if(x.from<=date)cur=x.orgId;return cur||(u.orgHistory[0]&&u.orgHistory[0].orgId)||null;}
const userOrg=u=>userOrgAt(u,today());
/* RG-020 : un gestionnaire ne reçoit que les données de son périmètre ; null = tous les périmètres (administrateur) */
function scopeSet(){
  if(S.profile==='ADMIN')return null;
  const s=new Set();
  if(S.profile==='MANAGER')for(const id of (S.account&&S.account.scopeOrgIds)||[])orgDescendants(id).forEach(x=>s.add(x));
  return s;
}
const inScope=u=>{const sc=scopeSet();return !sc||sc.has(userOrg(u));};
function scopedUsers(){need2('results.all','results.scope');return R('users').filter(inScope);}
function need2(a,b){if(!can(a)&&!can(b))throw new AppError('AUTH-FORBIDDEN','Action non autorisée','Votre profil ne permet pas cette action.','Changer de profil.');}
function visibleSessions(){
  if(can('results.all'))return txAll('sessions');
  if(can('results.scope')){const ids=new Set(scopedUsers().map(u=>u.id));return txAll('sessions').filter(s=>ids.has(s.userId));}
  need('self.results');return txAll('sessions').filter(s=>s.userId===S.collab);
}
function isEligible(u,cert){
  const a=cert.audience||{all:true,orgIds:[]};if(a.all)return true;
  const chain=orgAncestors(userOrg(u));return (a.orgIds||[]).some(i=>chain.includes(i));
}

/* ====== Questions : sélection, instantanés, notation ====== */
function snapshotQuestion(q){
  const base={id:q.id,version:q.version||1,type:q.type,text:q.text,points:Number(q.points),scoring:q.scoring||'ALL',penalty:!!q.penalty,explanation:q.explanation||'',category:q.category||'',difficulty:q.difficulty||1};
  if(q.type==='QCU'||q.type==='QCM'){const o=q.options.map(x=>({id:x.id,text:x.text}));return {...base,options:q.shuffle?shuffle(o):o,correct:[...q.correct]};}
  if(q.type==='TF')return {...base,options:[{id:'T',text:'Vrai'},{id:'F',text:'Faux'}],correct:[q.correct[0]]};
  if(q.type==='ORDER'){const items=q.options.map(x=>({id:x.id,text:x.text}));let sh=shuffle(items);for(let i=0;i<8&&items.length>1&&sh.every((x,j)=>x.id===items[j].id);i++)sh=shuffle(items);return {...base,options:sh,correctOrder:items.map(i=>i.id)};}
  const left=q.pairs.map(p=>({id:p.id,text:p.left}));   // MATCH : l'option de droite porte l'id de sa paire
  return {...base,left,options:shuffle(q.pairs.map(p=>({id:p.id,text:p.right}))),correctMap:Object.fromEntries(q.pairs.map(p=>[p.id,p.id]))};
}
/* Correction par type (RF-032 / RF-051). Réponses : QCU/QCM/TF = tableau d'ids ; ORDER = tableau d'ids ordonné ; MATCH = { idGauche: idDroite } */
function scoreQuestion(q,ans){
  let f=0;
  if(q.type==='QCU'||q.type==='TF')f=Array.isArray(ans)&&ans.length===1&&q.correct.includes(ans[0])?1:0;
  else if(q.type==='QCM'){
    if(Array.isArray(ans)&&ans.length){const cor=new Set(q.correct);let r=0,w=0;new Set(ans).forEach(x=>cor.has(x)?r++:w++);
      f=q.scoring==='ALL'?(r===cor.size&&w===0?1:0):Math.max(0,(r-(q.penalty?w:0))/cor.size);}
  }else if(q.type==='ORDER'){
    if(Array.isArray(ans)&&ans.length===q.correctOrder.length){const ok=q.correctOrder.filter((id,i)=>ans[i]===id).length;f=q.scoring==='ALL'?(ok===q.correctOrder.length?1:0):ok/q.correctOrder.length;}
  }else if(q.type==='MATCH'){
    if(ans&&typeof ans==='object'){const ids=q.left.map(l=>l.id);const ok=ids.filter(id=>ans[id]===q.correctMap[id]).length;f=q.scoring==='ALL'?(ok===ids.length?1:0):ok/ids.length;}
  }
  return {obtained:f*q.points,max:q.points,ratio:f};
}
const isAnswered=(q,a)=>q.type==='MATCH'?!!(a&&Object.values(a).some(Boolean)):Array.isArray(a)&&a.length>0;
function eligiblePool(m){
  return R('questions').filter(q=>q.status==='PUBLISHED'&&(m.bankIds||[]).includes(q.bankId)&&(!(m.categories||[]).length||m.categories.includes(q.category))&&(!(m.difficulties||[]).length||m.difficulties.includes(q.difficulty)));
}
function seenIds(userId,moduleId){const s=new Set();for(const a of txAll('attempts'))if(a.userId===userId&&a.moduleId===moduleId)a.questionIdsPresented.forEach(i=>s.add(i));return s;}
function parseDistribution(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.lastIndexOf(':');return {category:x.slice(0,i).trim(),count:parseInt(x.slice(i+1),10)};}).filter(d=>d.category&&d.count>0);}
/* RF-040 / RF-061 : questions éligibles, jamais présentées à ce collaborateur pour ce module (identifiant stable) */
function pickQuestions(m,userId){
  const pool=eligiblePool(m),seen=seenIds(userId,m.moduleId),fresh=pool.filter(q=>!seen.has(q.id));
  const dist=parseDistribution(m.distribution),order=a=>m.selection==='FIXED'?a:shuffle(a);
  let chosen=[],deficit=0,needed;
  if(dist.length){needed=dist.reduce((s,d)=>s+d.count,0);for(const d of dist){const p=order(fresh.filter(q=>q.category===d.category));chosen.push(...p.slice(0,d.count));deficit+=Math.max(0,d.count-p.length);}}
  else{needed=m.questionCount;const p=order(fresh);chosen=p.slice(0,needed);deficit=Math.max(0,needed-p.length);}
  return {ok:deficit===0&&chosen.length>0,deficit,needed,poolSize:pool.length,fresh:fresh.length,questions:order(chosen).map(snapshotQuestion)};
}

/* ====== Formations correctives ====== */
function needStatus(n){const rs=txAll('regs').filter(r=>r.needId===n.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));return rs.length?rs[rs.length-1].status:'TO_REGISTER';}
const latestReg=n=>txAll('regs').filter(r=>r.needId===n.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).pop();
const latestNeed=(sid,mid)=>txAll('needs').filter(n=>n.sessionId===sid&&n.moduleId===mid).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).pop();

/* ====== Sessions, validation, rattrapage (RF-050 à RF-063) ====== */
const sessOfUser=(uid_,cid)=>txAll('sessions').filter(s=>s.userId===uid_&&(!cid||s.certificationId===cid)).sort((a,b)=>a.number-b.number);
const attOfSession=sid=>txAll('attempts').filter(a=>a.sessionId===sid);
const DEFAULT_RULES={minGlobal:70,keep:'BEST',maxAttempts:3,maxSessions:0,keepAcquired:true,acquiredMonths:0,training:'NONE',validityMonths:0};
const DEFAULT_MODCFG={weight:100,threshold:70,mandatory:true,includeInScore:true,durationMin:0,interruptAllowed:true,onLeave:'WARN',autoSubmit:true,warnMin:2,mode:'EXAM',questionCount:10,selection:'RANDOM',categories:[],difficulties:[],distribution:'',allowHelpDuring:false,introduction:''};
const weightedGlobal=l=>round(l.reduce((s,x)=>s+x.score*x.weight,0)/l.reduce((s,x)=>s+x.weight,0));   // RG-009
function evalSession(sess){
  const ver=D.tx.versions.get(sess.certificationVersionId),rules=sess.rules||ver.rules,atts=attOfSession(sess.id);
  const mods=ver.modules.map((m,i)=>{
    const mine=atts.filter(a=>a.moduleId===m.moduleId);
    const subs=mine.filter(a=>a.status==='submitted').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));
    const used=mine.filter(a=>a.status!=='in_progress').length;
    const inprog=mine.find(a=>a.status==='in_progress')||null;
    const carried=(sess.carried&&sess.carried[m.moduleId])||null;
    let retained=null;
    if(carried)retained=carried.score;
    else if(subs.length){const sc=subs.map(a=>a.score.normalized);retained=rules.keep==='BEST'?Math.max(...sc):sc[sc.length-1];}   // RG-010
    const validated=retained!=null&&retained>=m.threshold;                                                                        // RG-007 (≥)
    const exhausted=!validated&&!inprog&&rules.maxAttempts>0&&used>=rules.maxAttempts;
    return {m,index:i,subs,used,inprog,carried,retained,validated,exhausted};
  });
  // RG-009 : Σ(note retenue × poids) / Σ poids des modules inclus (facultatifs non passés exclus et identifiés)
  const calc=mods.filter(x=>x.m.includeInScore&&(x.m.mandatory||x.retained!=null));
  const sw=calc.reduce((s,x)=>s+Number(x.m.weight),0);
  const complete=mods.filter(x=>x.m.includeInScore&&x.m.mandatory).every(x=>x.retained!=null);
  let global=null,formula=[];
  if(sw>0&&complete&&calc.length){
    global=weightedGlobal(calc.map(x=>({score:x.retained,weight:Number(x.m.weight)})));
    formula=calc.map(x=>({moduleId:x.m.moduleId,title:x.m.title,weight:x.m.weight,score:x.retained,contribution:round(x.retained*x.m.weight/sw)}));
  }
  const excluded=mods.filter(x=>!calc.includes(x)).map(x=>x.m.title);
  const mandOk=mods.filter(x=>x.m.mandatory).every(x=>x.validated);
  const valid=mandOk&&global!=null&&global>=rules.minGlobal;                                                                    // RG-008
  const canImprove=mods.some(x=>!x.m.mandatory&&x.m.includeInScore&&x.retained==null)||mods.some(x=>x.retained!=null&&!x.validated&&!x.exhausted);
  let failReason=null;
  if(!valid){
    if(mods.some(x=>x.m.mandatory&&x.exhausted))failReason='MODULE';
    else if(mandOk&&global!=null&&global<rules.minGlobal&&!canImprove)failReason='GLOBAL';
    else if(mods.every(x=>x.validated||x.exhausted)&&!mods.every(x=>x.validated))failReason='MODULE';
  }
  return {ver,rules,mods,global,formula,sumWeights:sw,excluded,valid,failReason};
}
function moduleGate(sess,ev,x){
  const cert=getCert(sess.certificationId);
  if(sess.status!=='IN_PROGRESS')return {ok:false,reason:'La session n’est plus active.'};
  if(cert&&cert.status!=='PUBLISHED')return {ok:false,reason:'Parcours suspendu ou archivé.'};
  if(x.validated)return {ok:false,reason:'Module déjà validé.'};
  if(x.inprog)return {ok:false,reason:'Une tentative est en cours : reprise possible.',resume:true};
  if(x.exhausted)return {ok:false,reason:`Nombre maximal de tentatives atteint (${ev.rules.maxAttempts}).`};
  const prev=ev.mods.slice(0,x.index).find(y=>y.m.mandatory&&!y.validated&&y.used===0&&!y.carried);
  if(prev)return {ok:false,reason:`Passez d’abord le module « ${prev.m.title} » (ordre du parcours).`};
  if(x.used>0&&ev.rules.training==='MANDATORY'){                                                                                  // RG-014
    const n=latestNeed(sess.id,x.m.moduleId);
    if(n&&needStatus(n)!=='DONE')return {ok:false,training:true,reason:'Formation corrective obligatoire non réalisée (statut attendu : Réalisée).'};
  }
  return {ok:true};
}
function modStatus(sess,ev,x){
  if(x.validated)return 'VALIDATED';
  if(x.inprog)return 'IN_PROGRESS';
  const cert=getCert(sess.certificationId);if(cert&&cert.status==='SUSPENDED'&&sess.status==='IN_PROGRESS')return 'SUSPENDED';
  if(x.used>0)return moduleGate(sess,ev,x).ok?'TO_RETAKE':'NON_VALIDATED';
  return 'NOT_STARTED';
}
function sessState(sess,ev){
  if(sess.status==='VALIDATED')return sess.validUntil&&sess.validUntil<today()?'EXPIRED':'VALIDATED';
  if(sess.status!=='IN_PROGRESS')return sess.status;
  ev=ev||evalSession(sess);
  if(ev.mods.some(x=>x.used>0&&!x.validated&&moduleGate(sess,ev,x).training))return 'AWAITING_REMEDIATION';
  return 'IN_PROGRESS';
}
/* Persiste la validation / l'échec d'une session après une tentative (RG-018 : le certificat n'est délivré qu'après validation) */
async function settleSession(sess){
  const ev=evalSession(sess);let s=sess,changed=false;
  if(sess.status==='IN_PROGRESS'&&(ev.valid||ev.failReason)){
    s={...sess,endedAt:now(),globalScore:ev.global,result:{global:ev.global,formula:ev.formula,sumWeights:ev.sumWeights,excluded:ev.excluded,rounding:ST().decimals}};
    if(ev.valid){s.status='VALIDATED';s.validatedAt=now();if(ev.rules.validityMonths>0)s.validUntil=addMonths(today(),ev.rules.validityMonths);}
    else{s.status='FAILED';s.failReason=ev.failReason;}
    changed=true;
  }
  if(changed)await putTx('sessions',s,{verify:true});
  return s;
}
function certBlock(cert,u){
  if(cert.status!=='PUBLISHED')return cert.status==='SUSPENDED'?'Parcours suspendu.':'Parcours non publié.';
  if(!cert.activeVersionId||!D.tx.versions.has(cert.activeVersionId))return 'Aucune version publiée.';
  const t=today();
  if(cert.availableFrom&&t<cert.availableFrom)return `Disponible à partir du ${fmtDate(cert.availableFrom)}.`;
  if(cert.availableTo&&t>cert.availableTo)return `Disponibilité terminée le ${fmtDate(cert.availableTo)}.`;
  if(!u.active)return 'Collaborateur inactif.';
  if(!isEligible(u,cert))return 'Parcours non ouvert à votre population.';
  return '';
}
async function startSession(u,cert){
  need('self.take');
  const blk=certBlock(cert,u);if(blk)throw new AppError('PATH-UNAVAILABLE','Parcours indisponible',blk,'');
  const prev=sessOfUser(u.id,cert.id),last=prev[prev.length-1];
  if(last&&last.status==='IN_PROGRESS')return last;
  if(last&&last.status==='VALIDATED'&&!(last.validUntil&&last.validUntil<today()))throw new AppError('PATH-VALIDATED','Parcours déjà validé','Ce parcours est déjà validé.','');
  const ver=D.tx.versions.get(cert.activeVersionId);
  if(ver.rules.maxSessions>0&&prev.length>=ver.rules.maxSessions)throw new AppError('PATH-MAX_SESSIONS','Limite de sessions atteinte',`Le nombre maximal de sessions (${ver.rules.maxSessions}) est atteint.`,'Contacter un gestionnaire.');
  const carried={};
  if(ver.rules.keepAcquired&&last&&last.status!=='VALIDATED'&&last.failReason!=='GLOBAL'){                                       // RF-060 : modules acquis conservés
    for(const ps of prev.filter(p=>p.certificationVersionId===ver.id)){
      for(const x of evalSession(ps).mods){
        if(!x.validated)continue;
        const att=x.carried?null:[...x.subs].reverse().find(a=>a.score.normalized>=x.m.threshold);
        const at=x.carried?x.carried.validatedAt:att.submittedAt;
        if(ver.rules.acquiredMonths>0&&at.slice(0,10)<addMonths(today(),-ver.rules.acquiredMonths))continue;
        carried[x.m.moduleId]=x.carried||{fromSessionId:ps.id,attemptId:att.id,score:x.retained,validatedAt:at};
      }
    }
  }
  const s={id:uid(),userId:u.id,certificationId:cert.id,certificationVersionId:ver.id,number:prev.length+1,status:'IN_PROGRESS',startedAt:now(),endedAt:null,carried,rules:structuredClone(ver.rules),schemaVersion:APP.schema};
  await putTx('sessions',s,{verify:true});
  audit('SESSION_START',cert.code,`Session ${s.number} — ${u.id}`,{userId:u.id});
  return s;
}
async function abandonSession(sess){
  for(const a of attOfSession(sess.id).filter(x=>x.status==='in_progress'))await putTx('attempts',{...a,status:'cancelled',cancelledAt:now()});
  await putTx('sessions',{...sess,status:'ABANDONED',endedAt:now(),failReason:'ABANDONED'},{verify:true});
  audit('SESSION_ABANDON',sess.id,'Session abandonnée',{userId:sess.userId});
}
async function startAttempt(sess,moduleId){
  need('self.take');
  const ev=evalSession(sess),x=ev.mods.find(r=>r.m.moduleId===moduleId);
  if(!x)throw new AppError('DATA-NOT_FOUND','Module introuvable','Ce module n’appartient pas à la version du parcours.','');
  const g=moduleGate(sess,ev,x);
  if(!g.ok)throw new AppError('ATTEMPT-BLOCKED','Évaluation indisponible',g.reason,'');
  const pick=pickQuestions(x.m,sess.userId);
  if(!pick.ok){                                                                                                                  // RG-013 / ERR-009
    audit('QUESTION_SHORTAGE',x.m.code,`Module ${x.m.title} : ${pick.deficit} question(s) inédite(s) manquante(s) pour ${sess.userId}`,{userId:sess.userId,moduleId});
    throw new AppError('QUEST-SHORTAGE','Banque de questions insuffisante',`Il manque ${pick.deficit} question(s) inédite(s) pour composer cette évaluation (${pick.fresh} disponible(s), ${pick.needed} requise(s)).`,'Un administrateur a été alerté ; réessayez après enrichissement de la banque.');
  }
  const limit=x.m.durationMin>0?x.m.durationMin*60000:0;
  const a={id:uid(),userId:sess.userId,sessionId:sess.id,certificationId:sess.certificationId,certificationVersionId:sess.certificationVersionId,moduleId,moduleVersion:x.m.moduleVersion,
    attemptNumber:x.used+1,mode:x.m.mode,status:'in_progress',startedAt:now(),submittedAt:null,limitMs:limit,remainingMs:limit,interruptAllowed:x.m.interruptAllowed,onLeave:x.m.onLeave,
    autoSubmit:x.m.autoSubmit,warnMin:x.m.warnMin,allowHelp:x.m.allowHelpDuring,threshold:x.m.threshold,questions:pick.questions,questionIdsPresented:pick.questions.map(q=>q.id),
    answers:{},checked:{},currentIndex:0,score:null,passed:null,schemaVersion:APP.schema};
  await putTx('attempts',a,{verify:true});
  audit('ATTEMPT_START',x.m.code,`Tentative ${a.attemptNumber} — ${sess.userId}`,{userId:sess.userId,attemptId:a.id});
  return a;
}
/* Correction et clôture d'une tentative (idempotent : une tentative terminée n'est jamais recalculée) */
async function gradeAttempt(a,status,timedOut){
  const fresh=D.tx.attempts.get(a.id);
  if(!fresh||fresh.status!=='in_progress')return fresh;                                                                         // ERR-010 : double soumission
  let raw=0,max=0;const details=[];
  for(const q of a.questions){const r=scoreQuestion(q,a.answers[q.id]);raw+=r.obtained;max+=r.max;details.push({qid:q.id,obtained:round(r.obtained,4),max:r.max});}
  const normalized=max>0?round(raw/max*100):0;
  const done={...a,status,submittedAt:now(),cancelledAt:status==='cancelled'?now():undefined,timedOut:!!timedOut,remainingMs:a.remainingMs,
    score:{raw:round(raw,4),max,normalized},details,passed:status==='submitted'?normalized>=a.threshold:false};
  await writeJson(`${TXD.attempts}/${a.id}.json`,envelope([done]));   // l'état mémoire ne change qu'après écriture + relecture réussies
  const back=await readJson(`${TXD.attempts}/${a.id}.json`);
  if(!back||JSON.stringify(back.data[0])!==JSON.stringify(done))throw new AppError('WRITE-VERIFY','Écriture non confirmée','La relecture de la tentative ne correspond pas.','Vérifier OneDrive et réessayer.');
  D.tx.attempts.set(a.id,done);
  return done;
}
async function afterAttempt(done){
  const sess=D.tx.sessions.get(done.sessionId);
  if(done.status==='submitted'&&!done.passed){                                                                                   // RF-070
    const ver=D.tx.versions.get(done.certificationVersionId);
    if(ver.rules.training!=='NONE'){
      const n={id:uid(),userId:done.userId,sessionId:done.sessionId,certificationId:done.certificationId,certificationVersionId:done.certificationVersionId,moduleId:done.moduleId,attemptId:done.id,mandatory:ver.rules.training==='MANDATORY',createdAt:now()};
      await putTx('needs',n);audit('TRAINING_NEED',done.moduleId,`Besoin de formation ${n.mandatory?'obligatoire':'recommandé'} — ${done.userId}`,{userId:done.userId});
    }
  }
  const s=await settleSession(sess);
  if(s.status==='VALIDATED'&&!s.certificateId){try{await issueCertificate(s);}catch(e){notify('Le certificat n’a pas pu être généré : '+toAppError(e).message+' Il pourra être régénéré depuis le résultat du parcours.','error');}}
  return s;
}

/* ====== Certificat PDF (RF-080) : PDF écrit à la main, sans bibliothèque, polices standard PDF ====== */
const HELV=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN1252={'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'–':0x96,'—':0x97,'…':0x85,'€':0x80,'œ':0x9c,'Œ':0x8c,'•':0x95};
function pdfWidth(s,size,bold){let w=0;for(const ch of s){const c=ch.normalize('NFD')[0].charCodeAt(0);w+=(c>=32&&c<=126?HELV[c-32]:556);}return w*size/1000*(bold?1.07:1);}
function pdfStr(s){let o='';for(const ch of String(s).replace(/[\r\n\t]/g,' ')){const c=ch.charCodeAt(0);o+=c<256?ch:(WIN1252[ch]?String.fromCharCode(WIN1252[ch]):'?');}return '('+o.replace(/[\\()]/g,m=>'\\'+m)+')';}
function pdfWrap(s,size,maxW){const lines=[];let cur='';for(const w of String(s).split(/\s+/)){const t=cur?cur+' '+w:w;if(pdfWidth(t,size)>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function certificatePdf(c){
  const W=842,H=595,ops=[];
  const fill=(r,g,b)=>ops.push(`${r} ${g} ${b} rg`);
  const text=(s,x,y,size,font,center)=>{const w=pdfWidth(s,size,font==='F2');ops.push(`BT /${font} ${size} Tf ${(center?x-w/2:x).toFixed(2)} ${y} Td ${pdfStr(s)} Tj ET`);};
  ops.push('0.12 0.37 0.75 RG 4 w 30 30 782 535 re S 1 w 40 40 762 515 re S');
  const cx=421,cy=508,r=30,k=r*0.5523;                                                                                            // emblème vectoriel (pas d'image bitmap)
  fill(0.12,0.37,0.75);
  ops.push(`${cx+r} ${cy} m ${cx+r} ${cy+k} ${cx+k} ${cy+r} ${cx} ${cy+r} c ${cx-k} ${cy+r} ${cx-r} ${cy+k} ${cx-r} ${cy} c ${cx-r} ${cy-k} ${cx-k} ${cy-r} ${cx} ${cy-r} c ${cx+k} ${cy-r} ${cx+r} ${cy-k} ${cx+r} ${cy} c f`);
  fill(1,1,1);text((c.logoText||'CERT').slice(0,5),cx,cy-5,15,'F2',true);
  fill(0.1,0.1,0.1);
  text('CERTIFICAT',421,440,36,'F2',true);
  text(c.title||'Certificat de réussite',421,412,15,'F3',true);
  text('Décerné à',421,368,14,'F1',true);
  text(c.userName,421,330,28,'F2',true);
  text('Référence collaborateur : '+c.userId,421,306,12,'F1',true);
  text('pour avoir validé le parcours de certification',421,272,14,'F1',true);
  text(c.certTitle,421,240,22,'F2',true);
  text(`Version ${c.versionNumber} — note globale : ${fmtNum(c.globalScore)} / 100`,421,212,13,'F1',true);
  text('Validé le '+fmtDate(c.validatedAt)+(c.validUntil?' — valable jusqu’au '+fmtDate(c.validUntil):''),421,192,13,'F1',true);
  let y=160;for(const l of pdfWrap(c.mentions||'',9,600).slice(0,4)){text(l,421,y,9,'F3',true);y-=12;}
  text(c.issuer||'',140,100,13,'F2',false);
  ops.push('0.3 0.3 0.3 RG 0.8 w 560 98 m 740 98 l S');
  text(c.signatory||'',650,84,11,'F2',true);text(c.signatoryRole||'',650,70,10,'F3',true);
  text('Certificat n° '+c.number,421,58,10,'F1',true);
  const content=ops.join('\n');
  const font=n=>`<</Type/Font/Subtype/Type1/BaseFont/${n}/Encoding/WinAnsiEncoding>>`;
  const objs=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>',
    `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Contents 4 0 R/Resources<</Font<</F1 5 0 R/F2 6 0 R/F3 7 0 R>>>>>>`,
    `<</Length ${content.length}>>\nstream\n${content}\nendstream`,font('Helvetica'),font('Helvetica-Bold'),font('Helvetica-Oblique'),`<</Title ${pdfStr('Certificat '+c.number)}/Producer (Parcours de certification)>>`];
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${objs.length+1}/Root 1 0 R/Info 8 0 R>>\nstartxref\n${xr}\n%%EOF`;
  return Uint8Array.from(out,ch=>ch.charCodeAt(0));
}
async function issueCertificate(sess){
  const u=getUser(sess.userId),ver=D.tx.versions.get(sess.certificationVersionId),T=ST().certificate;
  if(sess.status!=='VALIDATED')throw new AppError('CERT-NOT_VALID','Certificat indisponible','Le parcours n’est pas validé.','');                                  // RG-018
  const old=txAll('certificates').find(c=>c.sessionId===sess.id);
  const id=old?old.id:uid(),number=old?old.number:`CERT-${new Date().getFullYear()}-${id.slice(0,8).toUpperCase()}`;
  const meta={id,number,sessionId:sess.id,userId:u.id,userName:fullName(u),certificationId:sess.certificationId,certTitle:ver.title,certificationVersionId:ver.id,versionNumber:ver.number,
    globalScore:sess.globalScore,validatedAt:sess.validatedAt,validUntil:sess.validUntil||null,title:T.title,issuer:T.issuer,logoText:T.logoText,mentions:T.mentions,signatory:T.signatory,signatoryRole:T.signatoryRole,
    pdfPath:`${TXD.certificates}/${number}.pdf`,createdAt:old?old.createdAt:now()};
  const pdf=certificatePdf(meta);
  await writeData(meta.pdfPath,pdf);
  const back=await readFile(meta.pdfPath);                                                                                       // ERR-012 : ne pas déclarer délivré sans relecture
  if(!back||back.size!==pdf.length)throw new AppError('CERT-WRITE','Génération du PDF échouée','Le fichier PDF n’a pas pu être écrit.','Régénérer le certificat.');
  meta.sha256=await sha256(pdf);
  await putTx('certificates',meta,{verify:true});
  if(sess.certificateId!==id){const s={...sess,certificateId:id};await putTx('sessions',s,{verify:true});}
  audit('CERTIFICATE_ISSUE',number,`Certificat délivré à ${u.id}`,{userId:u.id});
  return meta;
}
async function downloadCertificate(c){
  const f=await readFile(c.pdfPath);
  if(!f)throw new AppError('CERT-MISSING','PDF introuvable','Le fichier PDF du certificat est absent.','Le régénérer depuis le résultat du parcours.');
  const bytes=new Uint8Array(await f.arrayBuffer());
  if(c.sha256&&await sha256(bytes)!==c.sha256)notify('Attention : l’empreinte du PDF ne correspond pas à celle enregistrée.','warn');
  download(`${c.number}.pdf`,bytes,'application/pdf');audit('CERTIFICATE_DOWNLOAD',c.number,'Téléchargement',{userId:c.userId});
}

/* ====== Reporting (RF-090) : le périmètre est appliqué AVANT l'agrégation ====== */
function statsFor(cert,users,sessions){
  const elig=users.filter(u=>u.active&&isEligible(u,cert));
  const bu=new Map();for(const s of sessions)(bu.get(s.userId)||bu.set(s.userId,[]).get(s.userId)).push(s);
  let validated=0,failed=0,retake=0;
  for(const [,ss] of bu){
    const states=ss.map(s=>sessState(s));
    if(states.includes('VALIDATED')||states.includes('EXPIRED'))validated++;
    else if(['FAILED','ABANDONED'].includes(states[states.length-1]))failed++;
    if(ss.some(s=>evalSession(s).mods.some(x=>x.used>1)))retake++;
  }
  const started=bu.size,completed=validated+failed;
  return {cert,eligible:elig.length,population:users.filter(u=>u.active).length,started,completed,validated,failed,retake,sessions:sessions.length,avg:started?round(sessions.length/started,2):null};
}
function computeStats(f){
  const users=scopedUsers(),ids=new Set(users.map(u=>u.id)),rule=ST().statsOrgRule;
  const uOrg=(u,s)=>userOrgAt(u,rule==='AT_SESSION'&&s?s.startedAt.slice(0,10):today());
  const orgSet=f.orgId?orgDescendants(f.orgId):null;
  const sess=visibleSessions().filter(s=>ids.has(s.userId));
  const rows=[];
  for(const c of R('certs').filter(c=>(!f.certId||c.id===f.certId)&&c.versionsCount>0)){
    const us=users.filter(u=>!orgSet||orgSet.has(uOrg(u)));
    const ss=sess.filter(s=>s.certificationId===c.id&&(!f.versionId||s.certificationVersionId===f.versionId)&&(!f.from||s.startedAt.slice(0,10)>=f.from)&&(!f.to||s.startedAt.slice(0,10)<=f.to)
      &&(!orgSet||orgSet.has(uOrg(getUser(s.userId),s)))&&(!f.state||sessState(s)===f.state));
    const row=statsFor(c,us,ss);row.groups=[];
    const gt=f.orgId?ORG_CHILD[(getOrg(f.orgId)||{}).type]:'REGION';
    if(gt)for(const g of R('org').filter(o=>o.type===gt&&(!f.orgId||o.parentId===f.orgId))){
      const gs=orgDescendants(g.id);
      const gu=us.filter(u=>gs.has(uOrg(u))),gi=new Set(gu.map(u=>u.id));
      row.groups.push({org:g,...statsFor(c,gu,ss.filter(s=>gi.has(s.userId)))});
    }
    rows.push(row);
  }
  return rows;
}
function followRows(f){   // une ligne par session visible (UI-10)
  need2('results.all','results.scope');
  const rows=[];
  for(const s of visibleSessions()){
    const u=getUser(s.userId),c=getCert(s.certificationId);if(!u||!c)continue;
    if(f.certId&&c.id!==f.certId)continue;
    const org=userOrg(u);
    if(f.orgId&&!orgDescendants(f.orgId).has(org))continue;
    if(f.from&&s.startedAt.slice(0,10)<f.from)continue;if(f.to&&s.startedAt.slice(0,10)>f.to)continue;
    const ev=evalSession(s),st=sessState(s,ev);
    if(f.state&&st!==f.state)continue;
    if(f.q&&!norm(`${u.id} ${fullName(u)}`).includes(norm(f.q)))continue;
    rows.push({s,u,c,org,ev,st,failedMods:ev.mods.filter(x=>x.used>0&&!x.validated).map(x=>x.m.title)});
  }
  return rows.sort((a,b)=>fullName(a.u).localeCompare(fullName(b.u))||a.s.number-b.s.number);
}

/* R7 + R8 : sélection du dossier OneDrive, précédée de la fenêtre de validation ; le handle n'est enregistré dans IndexedDB qu'après authentification/initialisation */
async function configureFolder(){
  if(!window.showDirectoryPicker){notify('Navigateur non compatible : utilisez Chrome ou Edge.','error');return;}
  const consent=await formDialog({title:'Accès aux données',submit:'Valider et choisir le dossier',
    intro:h('div',null,h('p',null,'L’application va vous demander de sélectionner le dossier OneDrive (synchronisé sur cet appareil) qui contient les données : collaborateurs, résultats, certificats.'),
      h('p',null,'Aucune donnée n’est lue ni écrite avant votre validation. Le navigateur demandera ensuite sa propre autorisation.'),
      h('p',{class:'hint'},'Prérequis : dossier configuré « Toujours conserver sur cet appareil » dans OneDrive.'))});
  if(!consent)return;
  let dir;
  try{dir=await window.showDirectoryPicker({id:'cert-data',mode:'readwrite'});}catch(e){if(e.name==='AbortError')return;throw e;}
  const m=await readJson(REF.manifest,dir);
  let acc=null;
  if(m){
    if(!m.data||!m.data[0]||m.data[0].applicationId!==APP.id)throw new AppError('DB-WRONG_APP','Base incorrecte','Ce dossier n’appartient pas à cette application.','Choisir un autre dossier.');
    if(major(m.data[0].schemaVersion)!==major(APP.schema))throw new AppError('DB-SCHEMA_VERSION','Version de base incompatible',`Base en version ${m.data[0].schemaVersion}, application en version ${APP.schema}.`,'Utiliser la version d’application correspondante.');
    const doc=await readJson(REF.accounts,dir);
    if(!doc){   // aucun compte : proposer la création du premier administrateur
      const r=await formDialog({title:'Créer le premier compte administrateur',intro:`Le dossier « ${dir.name} » est une base valide mais ne contient aucun compte. Créez le premier administrateur.`,fields:adminFields(),submit:'Créer le compte',
        onSubmit:async v=>{const e=adminCheck(v);if(e)return e;const rec=accountRecord(v,await makeCred(v.pwd),now());await writeJson(REF.accounts,envelope([rec]),dir);acc=rec;}});
      if(!r)return;
    }else{
      validateDoc('accounts',doc,SCH);
      const r=await formDialog({title:'Authentification administrateur',intro:`Le dossier « ${dir.name} » contient déjà une base. Authentifiez-vous (compte administrateur de cette base) pour la connecter à ce poste.`,
        fields:[{name:'login',label:'Identifiant',required:true,autocomplete:'username'},{name:'pwd',label:'Mot de passe',type:'password',required:true,autocomplete:'current-password'}],submit:'Connecter',
        onSubmit:async v=>{const w=throttle();if(w)return w;acc=await verifyLogin(doc.data,v.login,v.pwd,'ADMIN');return loginResult(acc);}});
      if(!r)return;
    }
  }else{
    let n=0;for await(const _ of dir.values()){n++;break;}
    if(n>0)throw new AppError('DB-NOT_EMPTY','Dossier non vide','Le dossier contient des fichiers mais aucune base reconnue : aucune donnée n’est créée automatiquement.','Choisir un dossier vide ou une base existante.');
    const r=await formDialog({title:'Initialiser une nouvelle base',intro:`Le dossier « ${dir.name} » est vide. L’arborescence de données va être créée. Créez le premier compte administrateur.`,fields:adminFields(),submit:'Initialiser',
      onSubmit:async v=>{const e=adminCheck(v);if(e)return e;await initBase(dir,v);}});
    if(!r)return;
  }
  await loadAll(dir);
  acc=acc?R('accounts').find(a=>a.id===acc.id):R('accounts').find(a=>a.profiles.includes('ADMIN'));
  const rec={handle:dir,label:dir.name,selectedAt:now(),appInstanceId:(S.env&&S.env.appInstanceId)||uid(),expectedDataSetId:R('manifest')[0].dataSetId};
  await idbSet('dataDirHandle',rec);
  S.handle=dir;S.env=rec;S.access='READY';S.error=null;
  openProfile('ADMIN',acc,'folder');
  audit('FOLDER_SET',dir.name,'Dossier de données enregistré');
  notify('Dossier de données enregistré.');
}

/* Démarrage : relit le handle, puis fenêtre de validation (R7) AVANT toute demande d'autorisation au navigateur */
async function start(){
  if(!window.showDirectoryPicker||!window.indexedDB||!crypto.subtle){
    S.access='ERROR';S.error=new AppError('ENV-UNSUPPORTED','Navigateur non compatible','Cette application nécessite Chrome ou Edge (File System Access API).','Ouvrir le fichier avec Chrome ou Edge récent.');render();return;}
  let rec=null;try{rec=await idbGet('dataDirHandle');}catch(e){console.warn(e);}
  if(!rec||!rec.handle){S.access='NO_FOLDER';render();return;}
  S.handle=rec.handle;S.env=rec;S.access='NEEDS_PERMISSION';render();accessDialog();
}
function accessDialog(){
  if(S.accessOpen)return;S.accessOpen=true;
  let busy=false;
  const err=h('p',{class:'err',role:'alert'});
  const go=h('button',{type:'button',class:'btn primary'},icon('folder'),h('span',null,'Valider l’accès aux données'));
  const no=h('button',{type:'button',class:'btn'},icon('x'),h('span',null,'Refuser'));
  const dlg=h('dialog',{'aria-labelledby':'acct','data-persist':'1'},
    h('h2',{id:'acct'},'Accès aux données'),
    h('p',null,`L’application doit accéder au dossier « ${S.env.label} » (collaborateurs, résultats, certificats). Rien n’est lu avant votre validation ; le navigateur peut ensuite vous demander de confirmer l’autorisation.`),
    err,h('div',{class:'dlgbtns'},no,go));
  dlg.addEventListener('close',()=>{S.accessOpen=false;dlg.remove();});
  no.addEventListener('click',()=>dlg.close());
  go.addEventListener('click',async()=>{
    if(busy)return;busy=true;go.disabled=true;err.textContent='';
    try{
      let p=await S.handle.queryPermission({mode:'readwrite'});
      if(p!=='granted')p=await S.handle.requestPermission({mode:'readwrite'});   // geste utilisateur = ce clic
      if(p!=='granted')throw new AppError('FS-PERMISSION_DENIED','Accès refusé','L’autorisation n’a pas été accordée.','Cliquer à nouveau et accepter.');
      await loadAll(S.handle,S.env.expectedDataSetId);S.access='READY';S.error=null;
      audit('DATA_ACCESS','open','Accès aux données validé');
      dlg.close();render();
    }catch(e){const ae=toAppError(e);S.error=ae;err.textContent=`${ae.code} — ${ae.title}. ${ae.message} ${ae.action}`;busy=false;go.disabled=false;
      if(ae.code!=='FS-PERMISSION_DENIED'){S.access='ERROR';render();dlg.close();}}
  });
  document.body.append(dlg);dlg.showModal();go.focus();
}

/* ====== Profils et sessions ====== */

function loginResult(acc){

   PASSATION : identification, évaluation chronométrée, reprise

async function identify(matricule){
  need('self.take');
  const u=R('users').find(x=>norm(x.id)===norm(matricule));
  if(!u||!u.active)throw new AppError('AUTH-COLLAB','Identification impossible','Identifiant inconnu ou collaborateur inactif.','Vérifier votre identifiant.');
  if(S.profile==='MANAGER'&&(!S.account||S.account.collaboratorId!==u.id))throw new AppError('AUTH-COLLAB_SCOPE','Identification refusée','Un gestionnaire ne passe les évaluations que pour son propre compte collaborateur.','Demander à l’administrateur de lier votre compte à votre fiche collaborateur.');
  if(!await confirmDialog('Confirmer votre identité',`Vous êtes ${fullName(u)} (${u.id}) — ${orgPath(userOrg(u))} ?`,false,'Oui, c’est moi'))return;
  S.collab=u.id;
  if(S.profile==='ADMIN')audit('ADMIN_ASSIST',u.id,'Administrateur identifié en mode assistance/test');
  audit('COLLAB_IDENTIFY',u.id,'Identification du collaborateur',{userId:u.id});
  await settleOrphans(u.id);render();
}
/* ERR-011 : tentative fermée brutalement alors que l'interruption est interdite → règle documentée (soumission, ou annulation) */
async function settleOrphans(userId){
  for(const a of txAll('attempts').filter(x=>x.userId===userId&&x.status==='in_progress'&&!(S.run&&S.run.a.id===x.id)&&!x.interruptAllowed)){
    const st=a.onLeave==='CANCEL'?'cancelled':'submitted';
    const done=await gradeAttempt(a,st,false);if(st==='submitted')await afterAttempt(done);
    notify(`Une évaluation interrompue sans autorisation a été ${st==='cancelled'?'annulée':'soumise automatiquement'}.`,'warn');
    audit('ATTEMPT_ORPHAN',a.id,'Tentative close selon la règle de sortie',{userId});
  }
}
const announce=t=>{const l=document.getElementById('live');if(l)l.textContent=t;};
function beginRun(a){
  S.run={a,idx:Math.min(a.currentIndex||0,a.questions.length-1),last:{p:performance.now(),d:Date.now()},warned:false,saveState:'ok',q:Promise.resolve(),submitting:false,expired:false,locked:false};
  S.run.timer=setInterval(tick,1000);
  S.view='exam';S.param=null;render();
}
function tick(){   // référence monotone ; une mise en veille compte comme du temps écoulé (RF-042)
  const r=S.run;if(!r||r.submitting)return;
  const p=performance.now(),d=Date.now(),el=Math.max(p-r.last.p,d-r.last.d);r.last={p,d};
  if(r.a.limitMs>0&&!r.expired){
    r.a.remainingMs=Math.max(0,r.a.remainingMs-el);
    const t=document.getElementById('timer');if(t)t.textContent=mmss(r.a.remainingMs);
    if(!r.warned&&r.a.warnMin>0&&r.a.remainingMs<=r.a.warnMin*60000&&r.a.remainingMs>0){r.warned=true;announce(`Attention : il reste moins de ${r.a.warnMin} minute(s).`);notify(`Il reste moins de ${r.a.warnMin} minute(s).`,'warn');}
    if(r.a.remainingMs<=0)expire().catch(fail);
  }
}
async function expire(){
  const r=S.run;if(!r||r.expired)return;r.expired=true;
  if(r.a.autoSubmit){notify('Temps écoulé : vos réponses enregistrées sont soumises.','warn');await finishRun(true);}
  else{r.locked=true;announce('Temps écoulé. Vous pouvez soumettre vos réponses.');drawExam();}
}
function saveRun(){
  const r=S.run;if(!r)return Promise.resolve();
  r.a.currentIndex=r.idx;
  r.q=r.q.then(()=>putTx('attempts',r.a)).then(()=>{r.saveState='ok';r.savedAt=new Date();updSave();}).catch(e=>{r.saveState='ko';updSave();notify('Vos réponses ne sont PAS enregistrées : '+toAppError(e).message,'error');});
  return r.q;
}
function updSave(){const r=S.run,el=document.getElementById('savestate');if(!r||!el)return;el.textContent=r.saveState==='ok'?(r.savedAt?'Enregistré à '+r.savedAt.toLocaleTimeString('fr-FR'):'Prêt'):'⚠ Non enregistré';el.className=r.saveState==='ok'?'hint':'err-txt';}
async function suspendRun(){const r=S.run;if(!r)return;clearInterval(r.timer);await saveRun();audit('ATTEMPT_SUSPEND',r.a.id,'Tentative interrompue',{userId:r.a.userId});S.run=null;notify('Évaluation interrompue : vos réponses et le temps restant sont enregistrés.');}
async function finishRun(timedOut,status){
  const r=S.run;if(!r||r.submitting)return;
  r.submitting=true;clearInterval(r.timer);
  try{
    await r.q;
    const done=await gradeAttempt(r.a,status||'submitted',timedOut);
    await afterAttempt(done);
    audit(done.status==='cancelled'?'ATTEMPT_CANCEL':'ATTEMPT_SUBMIT',done.id,`Note ${done.score.normalized}/100`,{userId:done.userId,attemptId:done.id});
    S.run=null;
    if(done.status==='cancelled'){notify('Tentative annulée.','warn');S.view='path';S.param=done.certificationId;}else{S.view='modres';S.param=done.id;}
    render();
  }catch(e){r.submitting=false;r.timer=setInterval(tick,1000);throw e;}
}
async function leaveExam(){   // sortie de l'évaluation selon la règle du module (RF-043)
  const a=S.run.a;
  if(a.interruptAllowed){if(!await confirmDialog('Interrompre l’évaluation ?','Vos réponses et le temps restant sont enregistrés. Vous pourrez reprendre cette tentative plus tard.',false,'Interrompre'))return false;await suspendRun();return true;}
  if(a.onLeave==='SUBMIT'){if(!await confirmDialog('Quitter l’évaluation ?','L’interruption n’est pas autorisée : vos réponses actuelles seront soumises et corrigées.',true,'Soumettre et quitter'))return false;await finishRun(false);return false;}
  if(a.onLeave==='CANCEL'){if(!await confirmDialog('Quitter l’évaluation ?','L’interruption n’est pas autorisée : la tentative sera annulée et comptera comme une tentative utilisée.',true,'Annuler la tentative'))return false;await finishRun(false,'cancelled');return false;}
  notify('Sortie impossible : l’interruption est interdite pour ce module. Terminez puis soumettez l’évaluation.','warn');return false;
}
function resourceNode(rs){

    return h('li',null,h('strong',null,rs.title),' — ',ok?h('a',{href:rs.content,target:'_blank',rel:'noopener noreferrer'},rs.content):rs.content,h('span',{class:'hint'},' (lien externe : connexion Internet requise)'));}
  if(rs.type==='FILE')return h('li',null,h('strong',null,rs.title),' ',btn('Ouvrir le document','file',run(()=>openMedia(rs.content)),'sm'));
  return h('li',null,h('strong',null,rs.title),h('div',{style:'white-space:pre-wrap'},rs.content));

const MEDIA_EXT=/\.(pdf|png|jpe?g|gif|webp|txt|csv)$/i;
async function openMedia(path){   // chemin relatif au dossier de données, contrôle d'existence (RF-021 / RF-031)
  if(!/^media\/[^/]+$/.test(path)||!MEDIA_EXT.test(path))throw new AppError('MEDIA-INVALID','Document refusé','Chemin ou type de document non autorisé.','');
  const f=await readFile(path);
  if(!f)throw new AppError('MEDIA-MISSING','Document introuvable',`${path} est absent du dossier de données.`,'Prévenir un administrateur.');
  const url=URL.createObjectURL(f);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),120000);
}

/* Composant de question (aperçu, passation, correction) */
function qInput(q,ans,o){
  o=o||{};const fire=v=>{if(o.onChange)o.onChange(v);};const name='q'+uid().slice(0,6);
  const txt=id=>(q.options.find(x=>x.id===id)||{}).text;
  if(q.type==='QCU'||q.type==='QCM'||q.type==='TF'){
    const multi=q.type==='QCM';let cur=new Set(ans||[]);
    return h('div',{role:multi?'group':'radiogroup','aria-label':'Réponses possibles'},q.options.map(op=>{
      const sel=cur.has(op.id),good=q.correct.includes(op.id);
      const inp=h('input',{type:multi?'checkbox':'radio',name,value:op.id,checked:sel,disabled:o.readonly,onchange:e=>{if(multi){e.target.checked?cur.add(op.id):cur.delete(op.id);}else cur=new Set([op.id]);fire([...cur]);}});
      return h('label',{class:'opt'+(o.reveal?(good?' good':(sel?' bad':'')):'')},inp,h('span',null,op.text,o.reveal&&good?h('b',null,' — bonne réponse'):null,o.reveal&&sel&&!good?h('b',null,' — réponse incorrecte'):null));
    }));
  }
  if(q.type==='ORDER'){
    let order=Array.isArray(ans)&&ans.length===q.options.length?[...ans]:q.options.map(x=>x.id);
    const wrap=h('div',{role:'list','aria-label':'Éléments à classer'});
    const draw=(focusI,dir)=>{
      wrap.replaceChildren(...order.map((id,i)=>h('div',{class:'ordrow',role:'listitem'},h('b',null,(i+1)+'.'),h('span',null,txt(id)),
        btn('','arrup',()=>mv(i,-1),'sm',{'aria-label':`Monter « ${txt(id)} »`,disabled:o.readonly||i===0,'data-d':'up'}),
        btn('','arrdn',()=>mv(i,1),'sm',{'aria-label':`Descendre « ${txt(id)} »`,disabled:o.readonly||i===order.length-1,'data-d':'dn'}))));
      if(focusI!=null){const row=wrap.children[focusI];(row.querySelector(`[data-d="${dir<0?'up':'dn'}"]:not(:disabled)`)||row.querySelector('button:not(:disabled)'))?.focus();}
    };
    const mv=(i,d)=>{[order[i],order[i+d]]=[order[i+d],order[i]];draw(i+d,d);fire([...order]);};
    draw();
    return h('div',null,wrap,o.reveal?h('p',{class:'hint'},'Ordre attendu : '+q.correctOrder.map(txt).join(' → ')):null);
  }
  const cur={...(ans||{})};const rt=id=>(q.options.find(x=>x.id===id)||{}).text;
  return h('div',null,h('div',{class:'match'},q.left.map(l=>{const id='m'+uid().slice(0,6);
    return [h('label',{for:id},l.text),h('select',{id,disabled:o.readonly,onchange:e=>{cur[l.id]=e.target.value;fire({...cur});}},h('option',{value:''},'— choisir —'),q.options.map(op=>h('option',{value:op.id,selected:cur[l.id]===op.id},op.text)))];})),
    o.reveal?h('p',{class:'hint'},'Associations attendues : '+q.left.map(l=>`${l.text} → ${rt(l.id)}`).join(' ; ')):null);
}
function drawNav(){

  const r=await formDialog({title:'Prévisualisation de l’import',intro:preview,wide:true,submit:errs.length?`Importer uniquement les ${okRows.length} ligne(s) valide(s)`:`Importer ${okRows.length} ligne(s)`,danger:!!errs.length});

  audit('IMPORT','formations',`${okRows.length} ligne(s) importée(s), ${errs.length} rejet(s)`);notify(`${okRows.length} ligne(s) importée(s).`);render();

function checkCert(c){   // RG-003 : publication interdite si incomplet ou incohérent
  const E=[],W=[],d=c.draft;
  if(!c.title||!c.code)E.push('Code et intitulé obligatoires.');
  if(c.availableFrom&&c.availableTo&&c.availableFrom>c.availableTo)E.push('Dates de disponibilité incohérentes.');
  if(!d.modules.length)E.push('Le parcours ne contient aucun module.');
  if(!(d.rules.minGlobal>=0&&d.rules.minGlobal<=100))E.push('Note globale minimale invalide (0 à 100).');
  const inc=d.modules.filter(m=>m.includeInScore),sw=inc.reduce((s,m)=>s+Number(m.weight||0),0);
  if(d.modules.length&&sw<=0)E.push('La somme des poids des modules inclus dans le calcul doit être strictement positive.');
  else if(d.modules.length&&sw!==100)W.push(`La somme des poids est ${sw} (cible : 100).`);
  if(!c.audience.all&&!(c.audience.orgIds||[]).length)E.push('Population cible vide : choisir « tous » ou au moins une entité.');
  d.modules.forEach((cm,i)=>{
    const mod=getModule(cm.moduleId),n=`Module ${i+1}${mod?' « '+mod.title+' »':''}`;
    if(!mod){E.push(`${n} : module introuvable.`);return;}
    if(mod.status!=='PUBLISHED')E.push(`${n} : le module doit être publié.`);
    if(!(cm.threshold>=0&&cm.threshold<=100))E.push(`${n} : seuil invalide.`);
    if(!(cm.questionCount>=1))E.push(`${n} : nombre de questions invalide.`);
    if(!(mod.bankIds||[]).length)E.push(`${n} : aucune banque de questions associée.`);
    else{const pool=eligiblePool({...cm,bankIds:mod.bankIds}).length,need_=parseDistribution(cm.distribution).reduce((s,x)=>s+x.count,0)||cm.questionCount;
      if(pool<need_)E.push(`${n} : ${pool} question(s) publiée(s) éligible(s) pour ${need_} requise(s).`);
      else if(pool<need_*2&&d.rules.maxAttempts!==1)W.push(`${n} : banque limitée (${pool}) — les rattrapages exigent des questions inédites.`);}
  });
  if(!d.modules.some(m=>m.mandatory))W.push('Aucun module obligatoire.');
  return {E,W};
}

function validateQuestion(q){

  if(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(q.text))return 'L’énoncé contient des caractères non supportés.';

async function saveQuestion(q0){
  need('catalog.manage');
  const q=structuredClone(q0);normQ(q);q.points=Number(q.points);
  const e=validateQuestion(q);if(e)throw new AppError('QUESTION-INVALID','Question invalide',e,'');

  const bump=old&&old.status==='PUBLISHED';
  const next={...q,version:bump?(old.version||1)+1:(q.version||1),updatedAt:now(),author:q.author||(S.account&&S.account.login)||''};delete next.isNew;
  if(bump)await writeJson(`catalog/question_versions/${old.id}-v${old.version||1}.json`,envelope([old]));   // version antérieure conservée (RF-030)
  await saveRef('questions',d=>{const i=d.findIndex(x=>x.id===next.id);if(i<0)d.push(next);else d[i]=next;});
  audit('QUESTION_SAVE',next.id,`Question enregistrée (V${next.version}, ${next.status})`);S.edit=null;notify('Question enregistrée.');go('questions');
}
