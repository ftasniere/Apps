async function importQuestions(){
  need('catalog.manage');
  const f=await formDialog({title:'Importer des questions',submit:'Analyser',fields:[{name:'file',label:'Fichier CSV',type:'file',accept:'.csv,text/csv',required:true}]});
  if(!f)return;
  const rows=parseCsv(await f.file.text());const head=(rows.shift()||[]).map(norm);
  const miss=['id','banque','type','enonce'].filter(c=>!head.includes(c));
  if(miss.length)throw new AppError('IMPORT-COLUMNS','Colonnes manquantes','Colonnes obligatoires absentes : '+miss.join(', '),'Utiliser le modèle.');
  const ix=Object.fromEntries(QHEAD.map(c=>[c,head.indexOf(c)])),g=(r,c)=>ix[c]>=0?String(r[ix[c]]||'').trim():'';
  const yes=v=>['oui','o','true','1','yes'].includes(norm(v));
  const res=[],ids=new Set(),newBanks=new Map();
  rows.forEach((r,i)=>{
    const line=i+2,E=[],W=[];const id=g(r,'id'),type=QTYPE_ALIAS[norm(g(r,'type'))];
    if(!/^[A-Za-z0-9._-]{1,40}$/.test(id))E.push('identifiant invalide');else if(ids.has(id))E.push('identifiant en double dans le fichier');else if(R('questions').some(x=>x.id===id))E.push('identifiant déjà présent dans la banque');
    ids.add(id);
    const bn=g(r,'banque');let bank=R('banks').find(b=>norm(b.name)===norm(bn));
    if(!bn)E.push('banque manquante');else if(!bank){bank=newBanks.get(norm(bn));if(!bank){bank={id:uid(),name:bn,description:'',createdAt:now()};newBanks.set(norm(bn),bank);}W.push('banque « '+bn+' » créée');}
    if(!type)E.push('type inconnu « '+g(r,'type')+' »');
    const text=g(r,'enonce');if(!text)E.push('énoncé manquant');if(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(text))E.push('caractères non supportés');
    const pts=g(r,'points')===''?1:Number(String(g(r,'points')).replace(',','.'));if(!(pts>0))E.push('barème invalide');
    const dRaw=norm(g(r,'difficulte')),diff={facile:1,moyen:2,difficile:3}[dRaw]||(['1','2','3'].includes(dRaw)?+dRaw:1);
    const stRaw=norm(g(r,'statut')),status={brouillon:'DRAFT',draft:'DRAFT',archive:'ARCHIVED',archivee:'ARCHIVED'}[stRaw]||'PUBLISHED';
    const q={id,bankId:bank?bank.id:'',type,text,points:pts||1,scoring:['partiel','partial'].includes(norm(g(r,'notation')))?'PARTIAL':'ALL',penalty:yes(g(r,'penalite')),shuffle:yes(g(r,'melange')),explanation:g(r,'explication'),category:g(r,'categorie'),theme:g(r,'theme'),difficulty:diff,
      keywords:g(r,'mots_cles').split(/[,|]/).map(x=>x.trim()).filter(Boolean),status,version:1,author:S.account?S.account.login:'',updatedAt:now(),options:[],correct:[],pairs:[]};
    const opts=g(r,'options').split('|').map(x=>x.trim()).filter(Boolean),corr=g(r,'bonnes_reponses').split('|').map(x=>x.trim()).filter(Boolean);
    if(type==='QCU'||type==='QCM'){q.options=opts.map(t=>({id:uid().slice(0,8),text:t}));if(opts.length<2)E.push('au moins 2 options');
      const idx=corr.map(Number);if(!idx.length||idx.some(n=>!Number.isInteger(n)||n<1||n>opts.length))E.push('bonnes réponses invalides (numéros d’options)');else q.correct=idx.map(n=>q.options[n-1].id);
      if(type==='QCU'&&q.correct.length!==1)E.push('QCU : une seule bonne réponse');}
    else if(type==='TF'){const v=norm(corr[0]||'');if(['vrai','v','true'].includes(v))q.correct=['T'];else if(['faux','f','false'].includes(v))q.correct=['F'];else E.push('bonne réponse attendue : Vrai ou Faux');}
    else if(type==='ORDER'){q.options=opts.map(t=>({id:uid().slice(0,8),text:t}));if(opts.length<2)E.push('au moins 2 éléments à classer');}
    else if(type==='MATCH'){q.pairs=opts.map(p=>{const [l,rr]=p.split('=>');return {id:uid().slice(0,8),left:(l||'').trim(),right:(rr||'').trim()};});if(q.pairs.length<2||q.pairs.some(p=>!p.left||!p.right))E.push('paires invalides (gauche=>droite, 2 minimum)');}

    res.push({line,id,E,W,q});
  });
  const errs=res.filter(x=>x.E.length);
  const preview=h('div',null,h('p',null,`${res.length} ligne(s) analysée(s) : ${res.length-errs.length} valide(s), ${errs.length} en erreur.`),
    tbl(null,['Ligne','Identifiant','Résultat','Détail'],res.map(x=>[x.line,x.id,x.E.length?pill('Erreur','ko'):pill('OK','ok'),x.E.concat(x.W).join(' ; ')||'—']),'Fichier vide.'),

  const r=await formDialog({title:'Prévisualisation de l’import',intro:preview,wide:true,submit:errs.length||!res.length?'Fermer':`Importer ${res.length} question(s)`,noCancel:false});

  audit('IMPORT','questions',`${res.length} question(s) importée(s)`);notify(`${res.length} question(s) importée(s).`);render();

async function doBackup(prefix){
  need('backup.manage');
  const stamp=(prefix||'')+now().replace(/[-:]/g,'').replace('T','-').replace('Z','');
  const files=await walkTree('',['backups']);
  for(const p of files){const f=await readFile(p);await writeData(`backups/${stamp}/${p}`,new Uint8Array(await f.arrayBuffer()));}
  const ents=(await listDir('backups')).filter(([n,hd])=>hd.kind==='directory'&&/^\d{8}-\d{6}$/.test(n)).map(([n])=>n).sort();
  const bd=await dirAt(S.handle,['backups'],false);
  for(const n of ents.slice(0,Math.max(0,ents.length-CFG.keepBackups)))await bd.removeEntry(n,{recursive:true});
  return stamp;
}
async function restoreBackup(name){
  need('backup.manage');if(!await requireRecentAuth())return;
  if(!await confirmDialog('Restaurer cette sauvegarde ?',`Les données actuelles seront remplacées par la sauvegarde « ${name} » (les fichiers créés depuis seront retirés). Une sauvegarde de sécurité du jeu courant est créée avant.`,true,'Restaurer'))return;
  const safety=await doBackup('avant-restauration-');
  try{
    const files=await walkTree('backups/'+name);
    if(!files.includes('manifest.json'))throw new AppError('RESTORE-INVALID','Sauvegarde invalide','manifest.json est absent de la sauvegarde.','');
    for(const p of files)if(p.endsWith('.json'))JSON.parse(await (await readFile(`backups/${name}/${p}`)).text());   // contrôle avant écriture
    for(const p of files)await writeData(p,new Uint8Array(await (await readFile(`backups/${name}/${p}`)).arrayBuffer()));
    const keep=new Set(files);
    for(const p of await walkTree('',['backups']))if(!keep.has(p)){const [dp,n]=splitPath(p);await (await dirAt(S.handle,dp,false)).removeEntry(n);}
  }catch(e){const ae=toAppError(e);throw new AppError('RESTORE-INTERRUPTED','Restauration interrompue',`${ae.message} Le jeu courant reste récupérable : sauvegarde de sécurité « ${safety} ».`,'Restaurer cette sauvegarde de sécurité.');}
  await loadAll(S.handle,null);
  S.env={...S.env,expectedDataSetId:R('manifest')[0].dataSetId};await idbSet('dataDirHandle',S.env);
  audit('BACKUP_RESTORE',name,'Restauration effectuée');await auditQ;
  logout('Restauration terminée : reconnectez-vous (les comptes ont pu changer).');
}

  t('Export CSV : neutralisation des formules',()=>csvCell('=1+1').startsWith('"\''));

  t('PDF : en-tête, xref et fin de fichier cohérents',()=>{const u=certificatePdf({userName:'Éléa Müller',userId:'X',certTitle:'Test (a)',versionNumber:1,globalScore:80,validatedAt:now(),number:'CERT-T',mentions:'Mention longue '.repeat(20)});
    const s=String.fromCharCode(...u);const m=/startxref\n(\d+)\n%%EOF$/.exec(s);return s.startsWith('%PDF-1.4')&&!!m&&s.slice(+m[1],+m[1]+4)==='xref';});
  let ok=false;try{const c=await makeCred('Un mot de passe de test');ok=(await verifyLogin([{login:'t',active:true,profiles:['ADMIN'],...c}],'T','Un mot de passe de test','ADMIN'))!==null&&(await verifyLogin([{login:'t',active:true,profiles:['ADMIN'],...c}],'t','autre','ADMIN'))===null;}catch(e){ok=e.message;}
  T.push(['Mot de passe : dérivation PBKDF2 avec sel, vérification OK / KO',ok===true,ok===true?'':String(ok)]);
  const cap=(()=>{const p=P_MANAGER_DEFAULT;return !p.includes('accounts.manage')&&!p.includes('folder.manage')&&!P_USER.includes('results.scope');})();
  T.push(['Droits : le gestionnaire et l’utilisateur n’ont pas les droits d’administration',cap===true,'']);
  return T;
}
function viewMaint(){

  };
  drawBk().catch(fail);
  const months=n=>{const d=new Date();d.setMonth(d.getMonth()-n);return d.toISOString();};
  const rt=ST().retentionMonths;
  ret.replaceChildren(h('p',null,`Au-delà des durées de conservation définies (${rt.attempts} mois pour les tentatives, ${rt.certificates} mois pour les certificats, ${rt.audit} mois pour le journal), les éléments ci-dessous sont à examiner avec le référent compétent (aucune suppression automatique) :`),
    h('ul',null,h('li',null,`Tentatives : ${txAll('attempts').filter(a=>a.submittedAt&&a.submittedAt<months(rt.attempts)).length}`),h('li',null,`Certificats : ${txAll('certificates').filter(c=>c.createdAt<months(rt.certificates)).length}`)),
    h('p',{class:'hint'},'Journal d’audit : voir la rubrique « Journal » (événements antérieurs à '+rt.audit+' mois).'));
  return h('section',null,h('h1',{tabindex:'-1',id:'vt'},'Maintenance et sauvegardes'),
    h('div',{class:'card'},h('h2',null,'Contrôle d’intégrité'),h('p',null,'Valide tous les fichiers JSON (schémas), les références croisées, les PDF et les empreintes du journal.'),
      h('div',{class:'bar'},btn('Lancer le contrôle','check',run(async()=>{rep.replaceChildren(h('p',null,'Contrôle en cours…'));const r=await integrityReport();
        rep.replaceChildren(h('p',null,Object.entries(r.counts).map(([k,v])=>`${k} : ${v}`).join(' · ')),r.issues.length?tbl(`${r.issues.length} anomalie(s)`,['Objet','Référence','Anomalie'],r.issues):h('p',{class:'ok-txt'},'Aucune anomalie détectée.'));audit('INTEGRITY_CHECK','-',`${r.issues.length} anomalie(s)`);}),'primary')),rep),
    h('div',{class:'card'},h('h2',null,'Sauvegarde et restauration'),h('div',{class:'bar'},btn('Créer une sauvegarde','db',run(async()=>{const s=await doBackup();audit('BACKUP_CREATE',s,'Sauvegarde créée');notify(`Sauvegarde créée (${s}).`);await drawBk();}),'primary')),bk,
      h('p',{class:'hint'},'La restauration crée d’abord une sauvegarde de sécurité, contrôle la sauvegarde, remplace les fichiers puis recharge les données. Une copie de chaque fichier de référence est aussi conservée avant chaque modification (backups/auto).')),
    h('div',{class:'card'},h('h2',null,'Tests automatiques des règles métier'),h('div',{class:'bar'},btn('Exécuter les tests','play',run(async()=>{tests.replaceChildren(h('p',null,'Exécution…'));const T=await selfTests();
      tests.replaceChildren(tbl(`${T.filter(x=>x[1]).length} / ${T.length} test(s) réussi(s)`,['Test','Résultat','Détail'],T.map(x=>[x[0],pill(x[1]?'Réussi':'Échec',x[1]?'ok':'ko'),x[2]])));}))),tests),
    h('div',{class:'card'},h('h2',null,'Durées de conservation'),ret));

/* ====== Journal d'audit (RF-102) ====== */
function viewAudit(){
  need2('audit.read','audit.scope');
  const f=S.flt.audit=S.flt.audit||{q:'',action:'',from:'',to:''};const box=h('div');let evs=null;
  const draw=async()=>{
    if(!evs){evs=D.audit||await loadAudit();}
    const sc=can('audit.read')?null:scopeSet();
    let rows=evs.filter(e=>!sc||(e.userId&&getUser(e.userId)&&sc.has(userOrg(getUser(e.userId))))||(S.account&&e.accountId===S.account.id));
    rows=rows.filter(e=>(!f.action||e.action===f.action)&&(!f.from||e.timestamp.slice(0,10)>=f.from)&&(!f.to||e.timestamp.slice(0,10)<=f.to)&&(!f.q||norm([e.login,e.collaboratorId,e.object,e.summary,e.action].join(' ')).includes(norm(f.q))));
    const shown=rows.slice(0,300),okf=await Promise.all(shown.map(auditOk));
    box.replaceChildren(tbl(`${rows.length} événement(s)${rows.length>300?' (300 affichés)':''} — ${okf.every(Boolean)?'empreintes cohérentes':'ANOMALIE : empreinte non conforme'}`,['Date','Profil / compte','Action','Objet','Résumé','Intégrité'],
      shown.map((e,i)=>[fmtTs(e.timestamp),`${PROFILES[e.profile]||e.profile}${e.login?' ('+e.login+')':''}${e.collaboratorId?' · '+e.collaboratorId:''}`,e.action,e.object,e.summary,pill(okf[i]?'OK':'Altéré',okf[i]?'ok':'ko')]),'Aucun événement.'));
  };
  const actions=()=>[...new Set((D.audit||[]).map(e=>e.action))].sort();
  const bar=h('div',{class:'inl'});
  const drawBar=()=>bar.replaceChildren(h('label',null,'Action',h('select',{onchange:e=>{f.action=e.target.value;draw();}},selOpt([['','Toutes'],...actions().map(a=>[a,a])],f.action))),h('label',null,'Du',h('input',{type:'date',value:f.from,onchange:e=>{f.from=e.target.value;draw();}})),h('label',null,'Au',h('input',{type:'date',value:f.to,onchange:e=>{f.to=e.target.value;draw();}})),
    h('label',null,'Recherche',h('input',{type:'search',value:f.q,oninput:e=>{f.q=e.target.value;clearTimeout(f._t);f._t=setTimeout(draw,250);}})),btn('Actualiser','refresh',run(async()=>{evs=await loadAudit();drawBar();await draw();})));
  (async()=>{try{evs=D.audit||await loadAudit();drawBar();await draw();}catch(e){fail(e);}})();
  return h('section',null,h('h1',{tabindex:'-1',id:'vt'},'Journal d’audit'),bar,box,h('p',{class:'hint'},'Événements immuables (un fichier par événement), sans mot de passe ni secret. Chaque événement porte une empreinte SHA-256 permettant de détecter une modification manuelle.'));
}

    h('div',{class:'card'},h('h2',null,'Calcul et statistiques'),h('div',{class:'cols'},num(s,'decimals','Décimales d’arrondi des notes (règle unique)',0),
      h('div',{class:'fld'},h('label',{for:'sor'},'Rattachement pour les statistiques historiques'),h('select',{id:'sor',onchange:e=>{s.statsOrgRule=e.target.value;}},selOpt([['CURRENT','Rattachement actuel'],['AT_SESSION','Rattachement à la date de la session']],s.statsOrgRule))))),

    h('div',{class:'card'},h('h2',null,'Durées de conservation (mois)'),h('div',{class:'cols'},num(s.retentionMonths,'attempts','Tentatives et résultats',1),num(s.retentionMonths,'certificates','Certificats',1),num(s.retentionMonths,'audit','Journal d’audit',1))),
    h('div',{class:'card'},h('h2',null,'Droits du profil Gestionnaire'),h('p',{class:'hint'},'Socle : consulter les résultats et tableaux de bord de son périmètre, suivre les formations. Droits ci-dessous à accorder selon vos arbitrages ; l’import des inscriptions exige en plus l’autorisation individuelle du compte.'),
      h('div',{class:'chkgrp',role:'group','aria-label':'Droits du gestionnaire'},P_MANAGER_OPTIONAL.map(([k,l])=>h('label',null,h('input',{type:'checkbox',checked:pm.has(k),onchange:e=>{e.target.checked?pm.add(k):pm.delete(k);}}),l)))));
}
